<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <title>Kira</title>
    <link rel="icon" type="image/svg+xml" href="/icon.svg" />
    <link rel="apple-touch-icon" href="/apple-touch-icon-180x180.png" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="theme-color" content="#f4f4f4" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#121212" media="(prefers-color-scheme: dark)" />
    <script>
      // Apply the saved theme (system/light/dark) before first paint; 'system' follows the OS live.
      const mq = matchMedia('(prefers-color-scheme: dark)')
      const apply = () => {
        let t
        try { t = localStorage.getItem('kira.theme') } catch {}
        document.documentElement.classList.toggle('dark', t === 'dark' || (t !== 'light' && mq.matches))
      }
      apply()
      mq.addEventListener('change', apply)
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
