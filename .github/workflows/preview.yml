name: Preview

on: pull_request

permissions:
  checks: write
  contents: read
  pull-requests: write

jobs:
  preview:
    # Secrets aren't available to PRs from forks; only build previews for branches in this repo.
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    env:
      VITE_FIREBASE_API_KEY: ${{ secrets.VITE_FIREBASE_API_KEY }}
      VITE_FIREBASE_PROJECT_ID: ${{ secrets.VITE_FIREBASE_PROJECT_ID }}
      VITE_FIREBASE_SENDER_ID: ${{ secrets.VITE_FIREBASE_SENDER_ID }}
      VITE_FIREBASE_APP_ID: ${{ secrets.VITE_FIREBASE_APP_ID }}
    steps:
      - name: Branch name
        env:
          BRANCH: ${{ github.head_ref }}
        run: |
          if ! [[ "$BRANCH" =~ ^(feature|fix|chores|refactor)/[a-z0-9][a-z0-9-]*$ ]]; then
            echo "::error::Branch '$BRANCH' must be feature/, fix/, chores/ or refactor/ followed by a kebab-case name"
            exit 1
          fi
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: for f in scripts/check-*.ts; do node "$f"; done
      - run: npm run build
      - uses: FirebaseExtended/action-hosting-deploy@v0
        with:
          repoToken: ${{ secrets.GITHUB_TOKEN }}
          firebaseServiceAccount: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_EXPENSES_TRACKER_285FB }}
          projectId: expenses-tracker-285fb
          expires: 7d
