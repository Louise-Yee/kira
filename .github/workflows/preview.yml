name: Preview

on: pull_request

permissions:
  checks: write
  contents: read
  pull-requests: write

jobs:
  checks:
    # Secrets aren't available to PRs from forks; only run for branches in this repo.
    if: github.event.pull_request.head.repo.full_name == github.repository
    uses: ./.github/workflows/checks.yml
    secrets: inherit

  preview:
    needs: checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v8
        with:
          name: dist
          path: dist
      - uses: FirebaseExtended/action-hosting-deploy@v0
        with:
          repoToken: ${{ secrets.GITHUB_TOKEN }}
          firebaseServiceAccount: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_EXPENSES_TRACKER_285FB }}
          projectId: expenses-tracker-285fb
          expires: 7d
